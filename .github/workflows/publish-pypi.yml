name: Publish to PyPI

# Triggered by a version tag: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, do not upload)"
        type: boolean
        default: false

jobs:
  # ── 1. Sanity check: tag version must match pyproject.toml version ───────────
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: |
          # Strip leading 'v': v0.2.0 → 0.2.0
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check pyproject.toml version matches tag
        run: |
          PKG_VER=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          TAG_VER="${{ steps.ver.outputs.version }}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::pyproject.toml version ($PKG_VER) does not match tag ($TAG_VER)"
            exit 1
          fi
          echo "Version $PKG_VER OK"

  # ── 2. Build sdist + wheel ────────────────────────────────────────────────────
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build sdist and wheel
        run: uv build

      - name: Show built artifacts
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── 3. Publish to PyPI via OIDC Trusted Publishing ───────────────────────────
  #
  # One-time setup on PyPI (no secret token required):
  #   https://pypi.org/manage/account/publishing/
  #   → Add publisher:
  #       PyPI project name : rolang
  #       GitHub owner      : Rorical
  #       Repository        : Rolang
  #       Workflow filename : publish-pypi.yml
  #       Environment name  : pypi
  #
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    environment:
      name: pypi
      url: https://pypi.org/project/rolang/
    permissions:
      id-token: write   # Required for OIDC trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password needed — OIDC handles auth via the environment above.
        # To fall back to an API token instead of OIDC, comment out the OIDC
        # environment above and uncomment:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  # ── 4. Publish to TestPyPI on every main push (optional smoke-test) ──────────
  #
  # One-time setup on TestPyPI (same OIDC flow, environment name = testpypi):
  #   https://test.pypi.org/manage/account/publishing/
  #
  # publish-testpypi:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: testpypi
  #     url: https://test.pypi.org/project/rolang/
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist/
  #     - uses: pypa/gh-action-pypi-publish@release/v1
  #       with:
  #         repository-url: https://test.pypi.org/legacy/
